services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: karirmatch
      POSTGRES_USER: karirmatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-karirmatch}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karirmatch -d karirmatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:-change-me-local-only}
      DATABASE_URL: postgresql+psycopg://karirmatch:${POSTGRES_PASSWORD:-karirmatch}@db:5432/karirmatch
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./data/processed:/app/data/processed
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
