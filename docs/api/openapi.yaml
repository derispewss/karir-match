openapi: 3.1.0
info:
  title: KarirMatch API
  version: 0.1.0-draft
  description: |
    Kontrak draft untuk prototipe KarirMatch: pencarian lowongan dengan TF-IDF +
    Cosine Similarity, feed rekomendasi berbasis profil, bookmark, event tracking,
    dan evaluasi offline.

    Status: draft. Beberapa keputusan masih terbuka (mekanisme autentikasi,
    perhitungan QueryScore pada feed, dan perilaku q kosong). Lihat
    `docs/03-api-spec.md` untuk konteks dan keputusan terbuka.
  contact:
    name: Deris Firmansyah
  license:
    name: Belum ditentukan
servers:
  - url: http://localhost:8000
    description: Pengembangan lokal
tags:
  - name: Auth
    description: Registrasi, login, dan logout
  - name: Jobs
    description: Pencarian dan detail lowongan
  - name: Preferences
    description: Preferensi pengguna
  - name: Bookmarks
    description: Bookmark lowongan
  - name: Events
    description: Pencatatan interaksi
  - name: Recommendations
    description: Feed rekomendasi
  - name: Privacy
    description: Kontrol data pengguna
  - name: Admin
    description: Evaluasi offline khusus admin/peneliti

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Registrasi akun
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: raka@example.com
              password: kata-sandi-yang-kuat
      responses:
        '201':
          description: Akun dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Email sudah terdaftar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: raka@example.com
              password: kata-sandi-yang-kuat
      responses:
        '200':
          description: Login berhasil
          headers:
            Set-Cookie:
              description: Diisi bila mekanisme session cookie dipilih.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      operationId: logout
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '204':
          description: Sesi/token diakhiri
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/jobs/search:
    get:
      tags: [Jobs]
      summary: Mencari lowongan
      description: |
        Pencarian Top-K. Pengguna publik menerima tingkat kecocokan relatif dan
        term yang cocok, bukan skor mentah. Urutan deterministik: skor menurun,
        tanggal terbit terbaru, lalu job_id menaik.
      operationId: searchJobs
      security: []
      parameters:
        - name: q
          in: query
          required: true
          description: Query teks. String kosong diperlakukan sesuai keputusan produk.
          schema:
            type: string
          example: data analyst
        - name: location
          in: query
          required: false
          schema:
            type: string
          example: Jakarta
        - name: category
          in: query
          required: false
          schema:
            type: string
          example: Data
        - name: employment_type
          in: query
          required: false
          schema:
            type: string
          example: full_time
        - name: experience_level
          in: query
          required: false
          schema:
            type: string
          example: junior
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [relevance, date]
            default: relevance
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Hasil pencarian
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/jobs/{job_id}:
    get:
      tags: [Jobs]
      summary: Detail lowongan
      operationId: getJob
      security: []
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
      responses:
        '200':
          description: Detail lowongan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/me/preferences:
    get:
      tags: [Preferences]
      summary: Baca preferensi
      operationId: getPreferences
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '200':
          description: Preferensi pengguna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [Preferences]
      summary: Ganti preferensi
      operationId: updatePreferences
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesUpdate'
      responses:
        '200':
          description: Preferensi tersimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/me/bookmarks:
    get:
      tags: [Bookmarks]
      summary: Daftar bookmark
      operationId: listBookmarks
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Daftar bookmark
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Bookmarks]
      summary: Simpan bookmark
      description: Idempoten. Respons 201 untuk bookmark baru, 200 bila sudah ada.
      operationId: createBookmark
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookmarkCreateRequest'
      responses:
        '200':
          description: Bookmark sudah ada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkCreateResponse'
        '201':
          description: Bookmark dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkCreateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/me/bookmarks/{job_id}:
    delete:
      tags: [Bookmarks]
      summary: Hapus bookmark
      description: Idempoten; 204 juga bila bookmark tidak ditemukan.
      operationId: deleteBookmark
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/JobIdPath'
      responses:
        '204':
          description: Bookmark dihapus atau memang tidak ada
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/events:
    post:
      tags: [Events]
      summary: Catat interaksi
      operationId: createEvent
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateRequest'
      responses:
        '201':
          description: Event dicatat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/me/recommendations:
    get:
      tags: [Recommendations]
      summary: Feed rekomendasi Top-N
      description: |
        Pengguna tanpa riwayat memakai beta = 0 dan menerima hasil
        non-personalisasi. Lowongan yang sudah disimpan tidak diulang. Skor mentah
        tidak dikirim. Sebagian slot non-personalisasi disediakan untuk mitigasi
        feedback loop.
      operationId: getRecommendations
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Feed rekomendasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/me/data:
    delete:
      tags: [Privacy]
      summary: Hapus data pengguna
      description: |
        Menghapus preferensi, bookmark, riwayat pencarian, event interaksi, dan log
        rekomendasi milik pengguna. Akun tetap ada. Data evaluasi tidak dihapus.
      operationId: deleteMyData
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        '204':
          description: Data pengguna dihapus
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/admin/eval/summary:
    get:
      tags: [Admin]
      summary: Ringkasan evaluasi
      description: Hanya admin. Menampilkan metrik dengan konfigurasi dan hash dataset.
      operationId: getEvalSummary
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: experiment_id
          in: query
          required: false
          schema:
            type: string
            enum: [E1, E2, E3, E4, E5]
        - name: language
          in: query
          required: false
          schema:
            type: string
            enum: [id, en, mixed]
        - name: split
          in: query
          required: false
          schema:
            type: string
            enum: [validation, test]
      responses:
        '200':
          description: Ringkasan evaluasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/eval/run:
    post:
      tags: [Admin]
      summary: Jalankan evaluasi offline
      description: |
        Hanya admin. Eksekusi sinkron untuk query set kecil; jika melebihi batas
        waktu, jalankan lewat skrip CLI. Tidak ada task queue pada MVP.
      operationId: runEval
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvalRunRequest'
      responses:
        '200':
          description: Evaluasi selesai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalRunResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          description: Evaluasi gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: km_session
      description: Opsi autentikasi berbasis cookie sesi. HttpOnly dan Secure di deployment.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
      description: Opsi autentikasi berbasis bearer token.

  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    JobIdPath:
      name: job_id
      in: path
      required: true
      schema:
        type: string
      example: job_01JABCDEF

  responses:
    Unauthorized:
      description: Belum login atau sesi tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Tidak berhak mengakses resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Input tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Terlalu banyak percobaan
      headers:
        Retry-After:
          description: Detik sampai percobaan berikutnya diizinkan.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Database atau indeks belum siap
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Parameter limit harus antara 1 dan 50.
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            request_id:
              type: string
              example: req_01JABCDEF

    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        issue:
          type: string

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          format: password

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
        created_at:
          type: string
          format: date-time
        access_token:
          type: string
          description: Diisi hanya bila mekanisme bearer token dipilih.
        token_type:
          type: string
          description: Contoh bearer; diisi hanya bila token dipilih.

    JobSummary:
      type: object
      required:
        - job_id
        - title
        - skills
        - is_active
      description: |
        Field selain job_id, title, skills, dan is_active dapat kosong/tidak ada
        karena kualitas data sumber. Klien harus menangani field yang tidak ada.
      properties:
        job_id:
          type: string
        title:
          type: string
        company:
          type: string
        location:
          type: string
        employment_type:
          type: string
        experience_level:
          type: string
        category:
          type: string
        publication_date:
          type: string
          format: date
        skills:
          type: array
          items:
            type: string
        is_active:
          type: boolean

    JobDetail:
      allOf:
        - $ref: '#/components/schemas/JobSummary'
        - type: object
          required:
            - description
          properties:
            description:
              type: string
              description: Teks biasa, bukan HTML.
            qualifications:
              type: string
              description: Teks biasa, bukan HTML.
            source_url:
              type: string
              format: uri
            language:
              type: string
              enum: [id, en, mixed]

    MatchLevel:
      type: string
      enum: [high, medium, low]
      description: UI memetakan high/medium/low ke Tinggi/Sedang/Rendah.

    SearchFilters:
      type: object
      properties:
        location:
          type: [string, 'null']
        category:
          type: [string, 'null']
        employment_type:
          type: [string, 'null']
        experience_level:
          type: [string, 'null']

    SearchResultItem:
      type: object
      required: [job, match_level, matched_terms, reason]
      properties:
        job:
          $ref: '#/components/schemas/JobSummary'
        match_level:
          $ref: '#/components/schemas/MatchLevel'
        matched_terms:
          type: array
          items:
            type: string
        reason:
          type: string
          example: Cocok pada judul dan skills.

    SearchResponse:
      type: object
      required: [query, sort, limit, count, items]
      properties:
        query:
          type: string
        filters:
          $ref: '#/components/schemas/SearchFilters'
        sort:
          type: string
          enum: [relevance, date]
        limit:
          type: integer
        count:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchResultItem'
        message:
          type: string
          description: Pesan empty state bila tidak ada hasil.

    Preferences:
      type: object
      required:
        - categories
        - locations
        - employment_types
        - experience_levels
      properties:
        categories:
          type: array
          items:
            type: string
        locations:
          type: array
          items:
            type: string
        employment_types:
          type: array
          items:
            type: string
        experience_levels:
          type: array
          items:
            type: string
        updated_at:
          type: string
          format: date-time

    PreferencesUpdate:
      type: object
      required:
        - categories
        - locations
        - employment_types
        - experience_levels
      properties:
        categories:
          type: array
          items:
            type: string
        locations:
          type: array
          items:
            type: string
        employment_types:
          type: array
          items:
            type: string
        experience_levels:
          type: array
          items:
            type: string

    BookmarkItem:
      type: object
      required: [job, saved_at]
      properties:
        job:
          $ref: '#/components/schemas/JobSummary'
        saved_at:
          type: string
          format: date-time

    BookmarkList:
      type: object
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookmarkItem'
        count:
          type: integer
        next_offset:
          type: [integer, 'null']

    BookmarkCreateRequest:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string

    BookmarkCreateResponse:
      type: object
      required: [job_id, saved_at, created]
      properties:
        job_id:
          type: string
        saved_at:
          type: string
          format: date-time
        created:
          type: boolean

    EventType:
      type: string
      enum: [view, save, apply_click, rec_click, search, zero_result]

    EventCreateRequest:
      type: object
      required: [event_type]
      properties:
        event_type:
          $ref: '#/components/schemas/EventType'
        job_id:
          type: string
        query:
          type: string
        position:
          type: integer
          minimum: 1
        metadata:
          type: object
          additionalProperties: true
          description: Data tambahan yang tidak sensitif.

    EventResponse:
      type: object
      required: [event_id, event_type, is_simulated, created_at]
      properties:
        event_id:
          type: string
        event_type:
          $ref: '#/components/schemas/EventType'
        is_simulated:
          type: boolean
          description: Ditetapkan server; bukan input klien biasa.
        created_at:
          type: string
          format: date-time

    RecommendationItem:
      type: object
      required: [job, reason, source]
      properties:
        job:
          $ref: '#/components/schemas/JobSummary'
        match_level:
          $ref: '#/components/schemas/MatchLevel'
          description: |
            Opsional pada feed. Tampilkan hanya bila ada query/definisi relatif yang
            valid; untuk feed tanpa query, reason menjadi penjelasan utama.
        reason:
          type: string
          example: Mirip dengan lowongan yang Anda simpan.
        source:
          type: string
          enum: [profile, non_personalized]

    RecommendationResponse:
      type: object
      required: [personalized, non_personalized_slots, count, items]
      properties:
        personalized:
          type: boolean
        non_personalized_slots:
          type: integer
        count:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationItem'

    Metrics:
      type: object
      properties:
        p_at_10:
          type: number
          minimum: 0
          maximum: 1
        r_at_10:
          type: number
          minimum: 0
          maximum: 1
        f1_at_10:
          type: number
          minimum: 0
          maximum: 1
        map:
          type: number
          minimum: 0
          maximum: 1
        ndcg_at_10:
          type: number
          minimum: 0
          maximum: 1

    Latency:
      type: object
      properties:
        median:
          type: number
          description: Milidetik.
        p95:
          type: number
          description: Milidetik.

    EvalExperiment:
      type: object
      required:
        - experiment_id
        - config_hash
        - dataset_hash
        - language
        - split
        - query_count
        - metrics
      properties:
        experiment_id:
          type: string
          enum: [E1, E2, E3, E4, E5]
        config_hash:
          type: string
        dataset_hash:
          type: string
        language:
          type: string
          enum: [id, en, mixed]
        split:
          type: string
          enum: [validation, test]
        query_count:
          type: integer
        metrics:
          $ref: '#/components/schemas/Metrics'
        latency_ms:
          $ref: '#/components/schemas/Latency'
        index_size_mb:
          type: number

    EvalSummary:
      type: object
      required: [generated_at, experiments]
      properties:
        generated_at:
          type: string
          format: date-time
        experiments:
          type: array
          items:
            $ref: '#/components/schemas/EvalExperiment'

    EvalRunRequest:
      type: object
      required: [experiment_id, config_path, split]
      properties:
        experiment_id:
          type: string
          enum: [E1, E2, E3, E4, E5]
        config_path:
          type: string
          example: configs/e2_tfidf_stem_en.yaml
          description: Harus berada di direktori konfigurasi yang diizinkan.
        split:
          type: string
          enum: [validation, test]

    EvalRunResponse:
      type: object
      required:
        - run_id
        - status
        - experiment_id
        - config_hash
        - dataset_hash
        - metrics
      properties:
        run_id:
          type: string
        status:
          type: string
          enum: [completed, failed]
        experiment_id:
          type: string
          enum: [E1, E2, E3, E4, E5]
        config_hash:
          type: string
        dataset_hash:
          type: string
        metrics:
          $ref: '#/components/schemas/Metrics'
