openapi: 3.1.0
info:
  title: KarirMatch API
  version: 0.1.0
  description: API untuk pencarian, rekomendasi, dan manajemen pengguna pada platform KarirMatch.
servers:
  - url: http://localhost:8000
    description: Development server
paths:
  /health:
    get:
      tags:
        - system
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: karirmatch-api
                  version:
                    type: string
                    example: 0.1.0
                  environment:
                    type: string
                    example: development
  /auth/register:
    post:
      tags:
        - auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterIn'
      responses:
        '201':
          description: User created and JWT returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '409':
          description: Email already registered
  /auth/login:
    post:
      tags:
        - auth
      summary: Login and obtain JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterIn'
      responses:
        '200':
          description: Successful login, JWT returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '401':
          description: Invalid credentials
        '429':
          description: Too many login attempts
  /auth/me:
    get:
      tags:
        - auth
      summary: Get current authenticated user info
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401':
          description: Unauthorized
  /auth/logout:
    post:
      tags:
        - auth
      summary: Logout (client-side)
      responses:
        '200':
          description: Logout successful
  /api/jobs/search:
    get:
      tags:
        - jobs
      summary: Search for jobs
      parameters:
        - name: q
          in: query
          required: false
          description: Query teks; kosong berarti daftar lowongan tanpa skor teks.
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: skill
          in: query
          schema:
            type: string
        - name: employment_type
          in: query
          description: Filter tipe pekerjaan (misal Full-Time, Contract).
          schema:
            type: string
        - name: experience_level
          in: query
          description: Filter level pengalaman (misal Mid-Level).
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [score, date]
            default: score
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSearchResponse'
        '503':
          description: Index not ready
  /api/jobs/{job_id}:
    get:
      tags:
        - jobs
      summary: Get job detail
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobDetail'
        '404':
          description: Job not found
  /api/me/preferences:
    get:
      tags:
        - preferences
      summary: Get user preferences
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Preferences object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
    put:
      tags:
        - preferences
      summary: Update user preferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferencesPayload'
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferencesResponse'
  /api/me/bookmarks:
    get:
      tags:
        - bookmarks
      summary: List saved jobs
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of bookmarked jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkListResponse'
    post:
      tags:
        - bookmarks
      summary: Add a bookmark (idempotent)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookmarkPayload'
      responses:
        '200':
          description: Bookmark already existed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkCreateResponse'
        '201':
          description: Bookmark created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkCreateResponse'
        '404':
          description: Job not found
  /api/me/bookmarks/{job_id}:
    delete:
      tags:
        - bookmarks
      summary: Remove a bookmark (idempotent)
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Bookmark removed (or not present)
  /api/events:
    post:
      tags:
        - events
      summary: Log an interaction event
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventIn'
      responses:
        '200':
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '404':
          description: Job not found
  /api/me/recommendations:
    get:
      tags:
        - recommendations
      summary: Get personalised job feed
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Recommendation list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
  /api/me/data:
    delete:
      tags:
        - user
      summary: Delete all personal data of the authenticated user
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Personal data deleted (idempotent)
  /api/admin/eval/summary:
    get:
      tags:
        - admin
      summary: Get evaluation summary (admin only)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalSummary'
        '403':
          description: Forbidden
  /api/admin/eval/run:
    post:
      tags:
        - admin
      summary: Trigger evaluation run (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: config_path
          in: query
          required: false
          description: Direktori run di dalam folder artifacts.
          schema:
            type: string
            default: artifacts
      responses:
        '200':
          description: Evaluation triggered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvalRunResponse'
        '400':
          description: Path is outside the allowed artifacts directory
        '403':
          description: Forbidden
        '500':
          description: Evaluation process failed
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterIn:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        full_name:
          type: [string, 'null']
    TokenOut:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: bearer
    UserInfo:
      type: object
      properties:
        user_id:
          type: integer
        email:
          type: string
        full_name:
          type: [string, 'null']
        is_admin:
          type: boolean
    JobSearchResponse:
      type: object
      properties:
        query:
          type: string
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        sort:
          type: string
          enum: [score, date]
        results:
          type: array
          items:
            $ref: '#/components/schemas/JobSearchResult'
        message:
          type: string
    JobSearchResult:
      type: object
      properties:
        job_id:
          type: string
        title:
          type: string
        company:
          type: string
        location:
          type: string
        category:
          type: string
        employment_type:
          type: [string, 'null']
        experience_level:
          type: [string, 'null']
        is_simulated:
          type: boolean
        match_level:
          type: string
          enum: [Sangat Sesuai, Sesuai, Cukup Sesuai, Standar]
        matched_terms:
          type: array
          items:
            type: string
        reason:
          type: string
        posted_at:
          type: [string, 'null']
          format: date-time
    JobDetail:
      type: object
      properties:
        job_id:
          type: string
        title:
          type: string
        description:
          type: string
        company:
          type: string
        location:
          type: string
        category:
          type: [string, 'null']
        employment_type:
          type: [string, 'null']
        experience_level:
          type: [string, 'null']
        source:
          type: [string, 'null']
        is_active:
          type: boolean
        is_simulated:
          type: boolean
        skills:
          type: array
          items:
            type: string
        posted_at:
          type: [string, 'null']
          format: date-time
    PreferencesPayload:
      type: object
      properties:
        categories:
          type: array
          items:
            type: string
        locations:
          type: array
          items:
            type: string
        employment_types:
          type: array
          items:
            type: string
        experience_levels:
          type: array
          items:
            type: string
        keywords:
          type: array
          items:
            type: string
    PreferencesResponse:
      type: object
      properties:
        user_id:
          type: integer
        preferences:
          $ref: '#/components/schemas/PreferencesPayload'
    BookmarkPayload:
      type: object
      required: [job_id]
      properties:
        job_id:
          type: string
    BookmarkItem:
      type: object
      properties:
        job_id:
          type: string
        title:
          type: string
        company:
          type: string
        location:
          type: string
        category:
          type: string
        is_simulated:
          type: boolean
        posted_at:
          type: [string, 'null']
          format: date-time
        saved_at:
          type: [string, 'null']
          format: date-time
    BookmarkListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookmarkItem'
        count:
          type: integer
        next_offset:
          type: [integer, 'null']
    BookmarkCreateResponse:
      allOf:
        - $ref: '#/components/schemas/BookmarkItem'
        - type: object
          properties:
            created:
              type: boolean
    EventIn:
      type: object
      required: [job_id, event_type]
      properties:
        job_id:
          type: string
        event_type:
          type: string
          enum: [view, click, save, apply]
        is_simulated:
          type: boolean
          default: false
          description: Hanya admin yang dapat menandai event sebagai simulasi.
    EventResponse:
      type: object
      properties:
        event_id:
          type: integer
        job_id:
          type: string
        event_type:
          type: string
          enum: [view, click, save, apply]
        is_simulated:
          type: boolean
    RecommendationResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationItem'
    RecommendationItem:
      type: object
      properties:
        job_id:
          type: string
        title:
          type: string
        company:
          type: string
        location:
          type: string
        category:
          type: string
        match_level:
          type: string
          enum: [Sangat Sesuai, Sesuai, Cukup Sesuai, Standar]
        source:
          type: string
          enum: [profile, latest]
        reason:
          type: string
        is_simulated:
          type: boolean
        posted_at:
          type: [string, 'null']
          format: date-time
    EvalSummary:
      type: object
      properties:
        queries:
          type: integer
        judgments:
          type: integer
        runs:
          type: integer
        config_hash:
          type: [string, 'null']
        dataset_hash:
          type: [string, 'null']
    EvalRunResponse:
      type: object
      properties:
        detail:
          type: string
        run_id:
          type: integer
        report_path:
          type: string
        config_hash:
          type: [string, 'null']
        dataset_hash:
          type: [string, 'null']
