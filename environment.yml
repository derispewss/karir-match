# Environment development KarirMatch.
# Dibuat dengan Conda; jangan memasang dependensi proyek ke environment global.
name: karirmatch
channels:
  - conda-forge
dependencies:
  - python=3.11
  - fastapi>=0.115,<1
  - uvicorn>=0.34,<1
  - pydantic>=2.10,<3
  - python-dotenv>=1.0,<2
  - pytest>=8.3,<9
  - pytest-cov>=6,<7
  - httpx>=0.28,<1
  - ruff>=0.9,<1
  - numpy>=2.0,<3
  - scipy>=1.14,<2
  - scikit-learn>=1.6,<2
  - pandas>=2.2,<3
  - pyyaml>=6.0,<7
  - pip
