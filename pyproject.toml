[project]
name = "karirmatch"
version = "0.1.0"
description = "Prototipe pencarian dan rekomendasi lowongan kerja KarirMatch"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
